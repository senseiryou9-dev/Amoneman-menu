function DishImage({ src, alt, className }) {
  const [errored, setErrored] = useState(false);
  if (errored) {
    return <div className={`${className} flex items-center justify-center bg-terracotta-50`}><IconImage size={26} className="text-terracotta-300" /></div>;
  }
  return <img src={src} alt={alt} loading="lazy" onError={() => setErrored(true)} className={`${className} object-cover bg-neutral-100`} />;
}

function Header() {
  const [imgError, setImgError] = useState(false);
  return (
    <header className="sticky top-0 z-30 flex items-center justify-center border-b border-neutral-100 bg-white py-2">
      {imgError ? (
        <div className="flex h-24 items-center justify-center"><span className="text-3xl font-extrabold tracking-[0.15em] text-terracotta">AMONEMAN</span></div>
      ) : (
        <img src="./logo.jpg" alt="Amoneman Logo" className="h-24 object-contain" onError={() => setImgError(true)} />
      )}
    </header>
  );
}

  return (
    <div className="flex gap-2 overflow-x-auto px-4 pb-3 mt-4">

      ))}
    </div>
  );
}

function MenuCard({ item, qtyInCart, onAdd }) {
  return (
    <article className="flex items-center gap-3 rounded-3xl border border-neutral-100 bg-white p-3 shadow-sm shadow-neutral-200/40">
      <DishImage src={item.image} alt={item.name} className="h-20 w-20 shrink-0 rounded-2xl" />
      <div className="min-w-0 flex-1">
        <h3 className="truncate text-[15px] font-bold text-neutral-800">{item.name}</h3>
        <p className="mt-1 text-[15px] font-extrabold text-terracotta">{formatRupiah(item.price)}</p>
      </div>
      <button type="button" onClick={() => onAdd(item.id)} className="relative shrink-0 rounded-full border-2 border-terracotta px-4 py-2 text-sm font-bold text-terracotta transition active:scale-95 active:bg-terracotta-50">
        Tambah
        {qtyInCart > 0 && <span className="absolute -right-2 -top-2 flex h-5 w-5 items-center justify-center rounded-full bg-terracotta text-[11px] font-bold text-white">{qtyInCart}</span>}
      </button>
    </article>
  );
}

function CartBar({ count, total, onClick }) {
  if (count === 0) return null;
  return (
    <div className="fixed inset-x-0 bottom-0 z-30 flex justify-center">
      <div className="w-full max-w-md px-4" style={{ paddingBottom: 'max(1rem, calc(env(safe-area-inset-bottom) + 0.5rem))' }}>
        <div className="flex items-center justify-between gap-3 rounded-3xl border border-neutral-100 bg-white p-2 pl-5 shadow-[0_8px_30px_rgba(0,0,0,0.12)]" style={{ animation: 'slideUp 0.25s ease-out' }}>
          <div className="flex items-center gap-2 text-neutral-700">
            <IconShoppingBag size={18} />
            <span className="text-sm font-semibold">{count} item</span>
            <span className="text-neutral-300">|</span>
            <span className="text-sm font-extrabold text-neutral-900">{formatRupiah(total)}</span>
          </div>
          <button type="button" onClick={onClick} className="flex items-center gap-1 rounded-full bg-terracotta px-5 py-3 text-sm font-bold text-white shadow-lg shadow-terracotta/30 transition active:scale-95">
            Cek Pesanan <IconChevronRight size={16} />
          </button>
        </div>
      </div>
    </div>
  );
}

                          <span className="shrink-0 text-sm font-extrabold text-neutral-900">{formatRupiah(item.price * line.qty)}</span>
                        </div>
                        <p className="mt-0.5 text-xs text-neutral-400">{formatRupiah(item.price)} / porsi</p>
                        <div className="mt-2 flex items-center gap-3 rounded-full border border-neutral-200 bg-white px-1 py-1 w-fit">

            <div className="h-2" />
          </div>
          <div className="border-t border-neutral-100 bg-white px-5 pt-4" style={{ paddingBottom: 'max(1.25rem, calc(env(safe-area-inset-bottom) + 0.75rem))' }}>
            <div className="mb-3 flex items-center justify-between">
              <span className="font-semibold text-neutral-500">Total</span>
              <span className="text-xl font-extrabold text-neutral-900">{formatRupiah(total)}</span>
            </div>
            <button type="button" disabled={cart.length === 0} onClick={onCheckout} className={`flex w-full items-center justify-center gap-2 rounded-2xl py-4 text-[15px] font-bold text-white transition active:scale-[0.98] ${cart.length === 0 ? 'bg-neutral-200 text-neutral-400' : 'bg-[#25D366] shadow-lg'}`}>
              <IconMessageCircle size={18} /> Pesan via WhatsApp
            </button>
          </div>
        </div>
      </div>
    </React.Fragment>
  );
}

function ConfirmationScreen({ isOpen, total, tableNumber, onOpenWhatsApp, onBack }) {
  return (
    <div className={`fixed inset-0 z-[60] flex flex-col items-center justify-center bg-ivory px-6 transition-opacity duration-300 ${isOpen ? 'opacity-100' : 'pointer-events-none opacity-0'}`}>
      <button type="button" onClick={onBack} className="absolute left-6 flex h-9 w-9 items-center justify-center rounded-full bg-white shadow-sm transition active:scale-90" style={{ top: 'max(1.5rem, calc(env(safe-area-inset-top) + 0.5rem))' }}><IconX size={18} className="text-neutral-500" /></button>
      <Flourish className="mb-2 text-terracotta-300" />
      <div className="mb-6 flex h-20 w-20 items-center justify-center rounded-full border-2 border-terracotta"><IconCheck size={34} className="text-terracotta" /></div>
      <p className="mb-2 text-sm font-bold uppercase tracking-wide text-terracotta">Siap Dikirim</p>
      <h2 className="mb-2 text-center text-2xl font-extrabold text-neutral-900">Pesanan Anda Siap</h2>
      <p className="mb-8 max-w-xs text-center leading-relaxed text-neutral-500">WhatsApp akan terbuka dengan pesanan Anda untuk {tableNumber || 'meja Anda'}.</p>
      <div className="mb-4 flex w-full max-w-sm items-center justify-between rounded-2xl bg-white px-5 py-4 shadow-sm">
        <span className="font-semibold text-neutral-500">Total</span>
        <span className="text-xl font-extrabold text-terracotta">{formatRupiah(total)}</span>
      </div>
      <button type="button" onClick={onOpenWhatsApp} className="mb-3 flex w-full max-w-sm items-center justify-center gap-2 rounded-2xl bg-terracotta py-4 text-[15px] font-bold text-white shadow-lg shadow-terracotta/30 transition active:scale-[0.98]"><IconMessageCircle size={18} /> Buka WhatsApp</button>
      <button type="button" onClick={onBack} className="w-full max-w-sm rounded-2xl border-2 border-terracotta py-4 text-[15px] font-bold text-terracotta transition active:scale-[0.98]">Kembali ke Menu</button>
    </div>
  );
}

function App() {
  const [customerName, setCustomerName] = useState('');
  const [tableNumber, setTableNumber] = useState('');
  const [nameError, setNameError] = useState(false);
  const [tableError, setTableError] = useState(false);
  const [activeCategory, setActiveCategory] = useState(CATEGORIES[0]);
  const [cart, setCart] = useState([]);
  const [isCartOpen, setIsCartOpen] = useState(false);
  const [isConfirmOpen, setIsConfirmOpen] = useState(false);
  const [orderMessage, setOrderMessage] = useState('');

  const nameRef = useRef(null);
  const tableRef = useRef(null);
  const topRef = useRef(null);

  useEffect(() => {
    document.body.style.overflow = isCartOpen || isConfirmOpen ? 'hidden' : '';
  }, [isCartOpen, isConfirmOpen]);

  const menuById = useMemo(() => {
    const map = {};
    MENU_ITEMS.forEach((item) => { map[item.id] = item; });
    return map;
  }, []);

  const filteredItems = useMemo(() => MENU_ITEMS.filter((item) => item.category === activeCategory), [activeCategory]);
  const cartCount = cart.reduce((sum, l) => sum + l.qty, 0);
  const cartTotal = cart.reduce((sum, l) => sum + l.qty * menuById[l.id].price, 0);

  function getQtyInCart(id) {
    const line = cart.find((l) => l.id === id);
    return line ? line.qty : 0;
  }
  function addToCart(id) {
    setCart((prev) => {
      const existing = prev.find((l) => l.id === id);
      if (existing) return prev.map((l) => (l.id === id ? { ...l, qty: l.qty + 1 } : l));
      return [...prev, { id, qty: 1, note: '' }];
    });
  }
  function incrementQty(id) { setCart((prev) => prev.map((l) => (l.id === id ? { ...l, qty: l.qty + 1 } : l))); }
  function decrementQty(id) { setCart((prev) => prev.map((l) => (l.id === id ? { ...l, qty: l.qty - 1 } : l)).filter((l) => l.qty > 0)); }
  function updateNote(id, note) { setCart((prev) => prev.map((l) => (l.id === id ? { ...l, note } : l))); }
  function handleNameChange(e) { setCustomerName(e.target.value); if (nameError) setNameError(false); }
  function handleTableChange(e) { setTableNumber(e.target.value); if (tableError) setTableError(false); }

  function buildOrderMessage() {
    const itemLines = cart.map((line) => {
      const item = menuById[line.id];
      let text = `${line.qty}x ${item.name} - ${formatRupiah(item.price * line.qty)}`;
      if (line.note.trim()) text += `\n   Catatan: ${line.note.trim()}`;
      return text;
    }).join('\n');
    return ['*PESANAN BARU - AMONEMAN*', '', `Nama: ${customerName.trim()}`, `Meja: ${tableNumber}`, '', '--------------------------', itemLines, '--------------------------', '', `*Total: ${formatRupiah(cartTotal)}*`, '', 'Terima kasih!'].join('\n');
  }

  function handleCheckoutClick() {
    const missingName = !customerName.trim();
    const missingTable = !tableNumber;
    setNameError(missingName); setTableError(missingTable);
    if (missingName || missingTable) {
      setIsCartOpen(false);
      window.setTimeout(() => {
        if (topRef.current) topRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
        const target = missingName ? nameRef.current : tableRef.current;
        if (target) target.focus();
      }, 320);
      return;
    }
    setOrderMessage(buildOrderMessage());
    setIsCartOpen(false);
    setIsConfirmOpen(true);
  }

  function handleOpenWhatsApp() {
    const RESTAURANT_WHATSAPP_NUMBER = '6281935585910';
    window.open(`https://wa.me/${RESTAURANT_WHATSAPP_NUMBER}?text=${encodeURIComponent(orderMessage)}`, '_blank');
    setCart([]);
    setIsConfirmOpen(false);
  }

  function handleBackToMenu() { setIsConfirmOpen(false); }

  return (
    <div className="min-h-screen bg-ivory font-sans text-neutral-900">
      <div className="mx-auto max-w-md">
        <Header />
        <div ref={topRef}>
          <OrderInfoForm name={customerName} table={tableNumber} nameError={nameError} tableError={tableError} onNameChange={handleNameChange} onTableChange={handleTableChange} nameRef={nameRef} tableRef={tableRef} />
        </div>
        <CategoryTabs categories={CATEGORIES} active={activeCategory} onChange={setActiveCategory} />
        <main className="flex flex-col gap-3 px-4 pb-28">
          {filteredItems.map((item) => (
            <MenuCard key={item.id} item={item} qtyInCart={getQtyInCart(item.id)} onAdd={addToCart} />
          ))}
        </main>
      </div>
      <CartBar count={cartCount} total={cartTotal} onClick={() => setIsCartOpen(true)} />
      <CartModal isOpen={isCartOpen} onClose={() => setIsCartOpen(false)} cart={cart} menuById={menuById} onIncrement={incrementQty} onDecrement={decrementQty} onNoteChange={updateNote} total={cartTotal} onCheckout={handleCheckoutClick} />
      <ConfirmationScreen isOpen={isConfirmOpen} total={cartTotal} tableNumber={tableNumber} onOpenWhatsApp={handleOpenWhatsApp} onBack={handleBackToMenu} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
