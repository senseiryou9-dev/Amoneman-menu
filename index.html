<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Amoneman - Order</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { terracotta: '#C0563A', ivory: '#FDFBF7' }
                }
            }
        }
    </script>
    
    <!-- Load React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    
    <style>
        body { background-color: #FDFBF7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding-bottom: 80px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const MENU_DATA = [
            { id: 1, category: "Balinese Specials", name: "Kuah Balung", price: 15000, desc: "Sup tulang babi khas Bali dengan rempah rahasia." },
            { id: 2, category: "Balinese Specials", name: "Lawar Babi", price: 15000, desc: "Campuran daging babi cincang, sayuran, dan kelapa parut." },
            { id: 3, category: "Balinese Specials", name: "Plecing Kangkung", price: 10000, desc: "Kangkung segar dengan sambal tomat pedas khas Bali." },
            { id: 4, category: "Western & Modern", name: "Crispy Chicken Burger", price: 40000, desc: "Burger ayam renyah dengan kentang goreng." },
            { id: 5, category: "Drinks", name: "Lecy Tea", price: 15000, desc: "Es teh manis dengan buah leci asli." },
            { id: 6, category: "Drinks", name: "Ocean Blue", price: 20000, desc: "Minuman segar bersoda dengan sirup blue curacao." }
        ];

        function App() {
            const [tableNum, setTableNum] = useState("");
            const [cart, setCart] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);

            const addToCart = (item) => {
                const existing = cart.find(c => c.id === item.id);
                if (existing) {
                    setCart(cart.map(c => c.id === item.id ? { ...c, qty: c.qty + 1 } : c));
                } else {
                    setCart([...cart, { ...item, qty: 1, note: "" }]);
                }
            };

            const updateQty = (id, delta) => {
                setCart(cart.map(c => {
                    if (c.id === id) {
                        const newQty = c.qty + delta;
                        return newQty > 0 ? { ...c, qty: newQty } : null;
                    }
                    return c;
                }).filter(Boolean));
            };

            const updateNote = (id, note) => {
                setCart(cart.map(c => c.id === id ? { ...c, note } : c));
            };

            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            const formatRp = (num) => "Rp " + num.toLocaleString('id-ID');

            const handleCheckout = () => {
                if (!tableNum) {
                    alert("Mohon isi Nomor Meja terlebih dahulu.");
                    return;
                }
                if (cart.length === 0) {
                    alert("Keranjang masih kosong.");
                    return;
                }

                let text = `Halo, Pesanan Baru!\n*Meja: ${tableNum}*\n\n`;
                cart.forEach(item => {
                    text += `${item.qty}x ${item.name} (${formatRp(item.price * item.qty)})\n`;
                    if (item.note) text += `   Catatan: _${item.note}_\n`;
                });
                text += `\n*Total: ${formatRp(totalPrice)}*`;

                // Nomor WhatsApp Amoneman otomatis terpasang
                const waNumber = "6281935585910"; 
                const waUrl = `https://wa.me/${waNumber}?text=${encodeURIComponent(text)}`;
                window.location.href = waUrl;
            };

            return (
                <div className="max-w-md mx-auto p-4 relative min-h-screen">
                    <div className="mb-6 text-center mt-4">
                        <h1 className="text-3xl font-bold text-terracotta tracking-tight">Amoneman</h1>
                        <p className="text-sm text-gray-500 mt-1">Balinese Food Modern</p>
                    </div>

                    <div className="bg-white p-4 rounded-xl shadow-sm mb-6 border border-gray-200">
                        <label className="block text-sm font-semibold text-gray-700 mb-2">Nomor Meja <span className="text-terracotta">*</span></label>
                        <input 
                            type="number" 
                            placeholder="Contoh: 4" 
                            className="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-terracotta focus:border-transparent transition-all"
                            value={tableNum}
                            onChange={(e) => setTableNum(e.target.value)}
                        />
                    </div>

                    <div className="space-y-4">
                        {MENU_DATA.map(item => (
                            <div key={item.id} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center">
                                <div className="flex-1 pr-4">
                                    <h3 className="font-bold text-gray-800 text-lg">{item.name}</h3>
                                    <p className="text-xs text-gray-500 mt-1 line-clamp-2">{item.desc}</p>
                                    <p className="text-sm font-bold text-terracotta mt-2">{formatRp(item.price)}</p>
                                </div>
                                <button 
                                    onClick={() => addToCart(item)}
                                    className="bg-terracotta text-white px-5 py-2 rounded-lg text-sm font-bold hover:bg-orange-700 active:scale-95 transition-transform shadow-md"
                                >
                                    Tambah
                                </button>
                            </div>
                        ))}
                    </div>

                    {totalItems > 0 && (
                        <div className="fixed bottom-0 left-0 right-0 p-4 bg-white border-t border-gray-200 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.1)] z-40">
                            <div className="max-w-md mx-auto flex justify-between items-center">
                                <div>
                                    <p className="text-xs text-gray-500 font-medium">{totalItems} Item</p>
                                    <p className="text-xl font-bold text-gray-900">{formatRp(totalPrice)}</p>
                                </div>
                                <button 
                                    onClick={() => setIsCartOpen(true)}
                                    className="bg-terracotta text-white px-6 py-3 rounded-xl font-bold hover:bg-orange-700 shadow-lg active:scale-95 transition-transform"
                                >
                                    Lihat Pesanan
                                </button>
                            </div>
                        </div>
                    )}

                    {isCartOpen && (
                        <div className="fixed inset-0 bg-black/70 z-50 flex flex-col justify-end backdrop-blur-sm">
                            <div className="bg-white w-full max-w-md mx-auto rounded-t-3xl p-5 min-h-[60vh] max-h-[90vh] overflow-y-auto pb-24 shadow-2xl">
                                <div className="flex justify-between items-center mb-6 border-b border-gray-100 pb-4">
                                    <h2 className="text-2xl font-bold text-gray-900">Pesanan Anda</h2>
                                    <button onClick={() => setIsCartOpen(false)} className="text-gray-400 hover:text-gray-600 font-bold p-2 text-xl">&times;</button>
                                </div>
                                
                                <div className="space-y-6">
                                    {cart.map(item => (
                                        <div key={item.id} className="border-b border-gray-100 pb-5">
                                            <div className="flex justify-between items-center mb-3">
                                                <h3 className="font-bold text-gray-800">{item.name}</h3>
                                                <p className="font-bold text-terracotta">{formatRp(item.price * item.qty)}</p>
                                            </div>
                                            <div className="flex justify-between items-center gap-4">
                                                <input 
                                                    type="text" 
                                                    placeholder="Catatan (opsional)..." 
                                                    className="text-sm bg-gray-50 p-2.5 rounded-lg flex-1 border border-gray-200 focus:outline-none focus:ring-1 focus:ring-terracotta"
                                                    value={item.note}
                                                    onChange={(e) => updateNote(item.id, e.target.value)}
                                                />
                                                <div className="flex items-center space-x-4 bg-gray-100 rounded-lg px-3 py-1.5 border border-gray-200">
                                                    <button onClick={() => updateQty(item.id, -1)} className="font-bold text-gray-600 text-lg px-2 hover:text-terracotta">&minus;</button>
                                                    <span className="font-bold text-gray-900">{item.qty}</span>
                                                    <button onClick={() => updateQty(item.id, 1)} className="font-bold text-gray-600 text-lg px-2 hover:text-terracotta">&#43;</button>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                
                                <button 
                                    onClick={handleCheckout}
                                    className="w-full bg-terracotta text-white py-4 rounded-2xl font-bold text-lg mt-8 shadow-xl hover:bg-orange-700 active:scale-95 transition-all"
                                >
                                    Kirim ke WhatsApp 
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
