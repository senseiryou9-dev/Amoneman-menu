function DishImage({ src, alt }) {
  const [errored, setErrored] = useState(false);
  if (errored) return <div className="h-20 w-20 shrink-0 rounded-2xl flex items-center justify-center bg-terracotta-50"><IconImage size={26} className="text-terracotta-300" /></div>;
  return <img src={src} alt={alt} loading="lazy" onError={() => setErrored(true)} className="h-20 w-20 shrink-0 rounded-2xl object-cover bg-neutral-100" />;
}

function CartModal({ isOpen, onClose, cart, menuById, onIncrement, onDecrement, onNoteChange, total, onCheckout }) {

      <div onClick={onClose} className="absolute inset-0 bg-neutral-900/40" />
      <div className="relative flex max-h-[86vh] w-full max-w-md flex-col overflow-hidden rounded-t-[28px] bg-ivory shadow-2xl">

        <div className="flex items-center justify-between px-5 pb-3 pt-2">

          <button type="button" onClick={onClose} className="flex h-8 w-8 items-center justify-center rounded-full bg-neutral-100 text-neutral-500"><IconX size={16} /></button>
        </div>
        <div className="flex-1 overflow-y-auto px-5">

            <div className="flex flex-col items-center justify-center py-16 text-center">
              <IconShoppingBag size={36} className="mb-3 text-neutral-300" />
              <p className="font-medium text-neutral-400">Keranjang Anda kosong</p>
            </div>
          ) : (
            <div className="divide-y divide-neutral-100">
              {cart.map((line) => {
                const item = menuById[line.id];
                return (
                  <div key={line.id} className="flex gap-3 py-4">
                    <img src={item.image} alt={item.name} className="h-14 w-14 shrink-0 rounded-xl object-cover bg-neutral-100" />

function App() {
  const [customerName, setCustomerName] = useState('');
  const [tableNumber, setTableNumber] = useState('');
  const [nameError, setNameError] = useState(false);
  const [tableError, setTableError] = useState(false);
  const [activeCategory, setActiveCategory] = useState(CATEGORIES[0]);
  const [cart, setCart] = useState([]);
  const [isCartOpen, setIsCartOpen] = useState(false);
  const [isConfirmOpen, setIsConfirmOpen] = useState(false);
  const [orderMessage, setOrderMessage] = useState('');

  const nameRef = useRef(null);
  const tableRef = useRef(null);

  useEffect(() => { document.body.style.overflow = isCartOpen || isConfirmOpen ? 'hidden' : ''; }, [isCartOpen, isConfirmOpen]);

  const menuById = useMemo(() => { const map = {}; MENU_ITEMS.forEach((item) => { map[item.id] = item; }); return map; }, []);
  const filteredItems = useMemo(() => MENU_ITEMS.filter((item) => item.category === activeCategory), [activeCategory]);
  const cartCount = cart.reduce((sum, l) => sum + l.qty, 0);
  const cartTotal = cart.reduce((sum, l) => sum + l.qty * menuById[l.id].price, 0);

  function getQtyInCart(id) { const line = cart.find((l) => l.id === id); return line ? line.qty : 0; }
  function addToCart(id) { setCart((prev) => { const existing = prev.find((l) => l.id === id); return existing ? prev.map((l) => (l.id === id ? { ...l, qty: l.qty + 1 } : l)) : [...prev, { id, qty: 1, note: '' }]; }); }
  function incrementQty(id) { setCart((prev) => prev.map((l) => (l.id === id ? { ...l, qty: l.qty + 1 } : l))); }
  function decrementQty(id) { setCart((prev) => prev.map((l) => (l.id === id ? { ...l, qty: l.qty - 1 } : l)).filter((l) => l.qty > 0)); }
  function updateNote(id, note) { setCart((prev) => prev.map((l) => (l.id === id ? { ...l, note } : l))); }

  function handleCheckoutClick() {
    const missingName = !customerName.trim();
    const missingTable = !tableNumber;
    setNameError(missingName); setTableError(missingTable);
    if (missingName || missingTable) {
      setIsCartOpen(false);
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
          const itemLines = cart.map((line) => {
      const item = menuById[line.id];
      return `${line.qty}x ${item.name} - ${formatRupiah(item.price * line.qty)}${line.note.trim() ? `\n   Catatan: ${line.note.trim()}` : ''}`;
    }).join('\n');
    
    setOrderMessage(['*PESANAN BARU - AMONEMAN*', '', `Nama: ${customerName.trim()}`, `Meja: ${tableNumber}`, '', '--------------------------', itemLines, '--------------------------', '', `*Total: ${formatRupiah(cartTotal)}*`, '', 'Terima kasih!'].join('\n'));
    setIsCartOpen(false); 
    setIsConfirmOpen(true);
  }

  return (
    <div className="mx-auto max-w-md pb-28">

        <img src="./logo.jpg" alt="Amoneman Logo" className="h-24 object-contain" onError={(e) => e.target.style.display='none'} />
      </header>
      
      <section className="px-4 pb-3 pt-5">
        <div className="mb-4">
          <label className="mb-1.5 block text-sm font-semibold text-neutral-700">Nama Pemesan</label>
          <input ref={nameRef} type="text" value={customerName} onChange={(e) => { setCustomerName(e.target.value); setNameError(false); }} placeholder="Masukkan nama Anda" className={`w-full rounded-2xl border bg-white px-4 py-3.5 text-[15px] outline-none ${nameError ? 'border-red-400' : 'border-neutral-200 focus:border-terracotta'}`} />
        </div>
        <div>
          <label className="mb-1.5 block text-sm font-semibold text-neutral-700">Pilih Meja</label>
          <div className="relative">

              <option value="" disabled>Pilih nomor meja</option>
              <option value="Take Away">Bawa Pulang (Take Away)</option>
              <option value="Meja 1">Meja 1</option>
              <option value="Meja 2">Meja 2</option>
              <option value="Meja 3">Meja 3</option>
              <option value="Meja 4">Meja 4</option>
              <option value="Meja 5">Meja 5</option>
              <option value="Meja 6">Meja 6</option>
              <option value="Meja 7">Meja 7</option>

        {filteredItems.map((item) => {
          const qty = getQtyInCart(item.id);
          return (
            <article key={item.id} className="flex items-center gap-3 rounded-3xl border border-neutral-100 bg-white p-3 shadow-sm">
              <DishImage src={item.image} alt={item.name} />
              <div className="min-w-0 flex-1">
                <h3 className="truncate text-[15px] font-bold text-neutral-800">{item.name}</h3>
                <p className="mt-1 text-[15px] font-extrabold text-terracotta">{formatRupiah(item.price)}</p>
              </div>
              <button type="button" onClick={() => addToCart(item.id)} className="relative shrink-0 rounded-full border-2 border-terracotta px-4 py-2 text-sm font-bold text-terracotta">
                Tambah {qty > 0 && <span className="absolute -right-2 -top-2 flex h-5 w-5 items-center justify-center rounded-full bg-terracotta text-[11px] font-bold text-white">{qty}</span>}
              </button>
            </article>
          );
        })}
      </main>

      {cartCount > 0 && (
        <div className="fixed inset-x-0 bottom-0 z-30 flex justify-center pb-4 px-4">
          <div className="flex w-full max-w-md items-center justify-between rounded-3xl border border-neutral-100 bg-white p-2 pl-5 shadow-[0_8px_30px_rgba(0,0,0,0.12)]">
            <div className="flex items-center gap-2 text-neutral-700">
              <IconShoppingBag size={18} />
              <span className="text-sm font-semibold">{cartCount} item</span>
              <span className="text-neutral-300">|</span>
              <span className="text-sm font-extrabold text-neutral-900">{formatRupiah(cartTotal)}</span>
            </div>
            <button type="button" onClick={() => setIsCartOpen(true)} className="flex items-center gap-1 rounded-full bg-terracotta px-5 py-3 text-sm font-bold text-white shadow-lg">Cek Pesanan <IconChevronRight size={16} /></button>
          </div>
        </div>
      )}

      <CartModal isOpen={isCartOpen} onClose={() => setIsCartOpen(false)} cart={cart} menuById={menuById} onIncrement={incrementQty} onDecrement={decrementQty} onNoteChange={updateNote} total={cartTotal} onCheckout={handleCheckoutClick} />
      
      <ConfirmationScreen isOpen={isConfirmOpen} total={cartTotal} tableNumber={tableNumber} onOpenWhatsApp={() => { window.open(`https://wa.me/6281935585910?text=${encodeURIComponent(orderMessage)}`, '_blank'); setCart([]); setIsConfirmOpen(false); }} onBack={() => setIsConfirmOpen(false)} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
